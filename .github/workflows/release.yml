name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:GITHUB_REF_NAME
          $title = $tag.TrimStart('v')

          $releaseExists = $true
          try {
            gh release view $tag *> $null
          } catch {
            $releaseExists = $false
          }

          $body = Get-Content -Path RELEASE_NOTES.md -Raw -Encoding UTF8

          if ($releaseExists) {
            gh release delete $tag --yes
          }

          gh release create $tag --title $title --notes "$body" --latest

          $assets = @(
            (Get-ChildItem -Path dist -Filter 'Czatbox-TT-Setup-*.exe' | Select-Object -First 1).FullName,
            (Get-ChildItem -Path dist -Filter 'Czatbox-TT-Setup-*.exe.blockmap' | Select-Object -First 1).FullName,
            (Join-Path $PWD 'dist\latest.yml')
          )

          gh release upload $tag @assets --clobber
