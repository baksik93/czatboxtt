<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Czatbox TT – wydarzenia i radio</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;color:#fff;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden}body{padding:7px}.stack{height:100%;display:flex;flex-direction:column;gap:7px}.widget,.radio-widget{border:1px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(24,21,29,.78);box-shadow:0 14px 34px rgba(0,0,0,.24);backdrop-filter:blur(18px);overflow:hidden}.widget{min-height:0;flex:1;display:flex;flex-direction:column}.radio-widget{flex:none;padding:11px 14px}.handle{padding:10px 15px 8px;border-bottom:1px solid rgba(255,255,255,.11);user-select:none}.handle strong{display:block;font-size:14px}.handle span{display:block;margin-top:3px;color:#c9c1ce;font-size:11px}.events{min-height:0;padding:8px 10px;overflow:auto;scrollbar-width:thin}.event{margin:0 0 7px;padding:9px 11px;border:1px solid;border-radius:11px}.event:last-child{margin-bottom:0}.event-name{margin:0 0 5px;font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.event-code{font-size:12px;font-weight:700}.event-time{font-size:12px;opacity:.88}.event-note{margin-top:8px;padding-top:7px;border-top:1px solid currentColor;font-size:12px;line-height:1.35}.event-note strong{display:block;margin-bottom:2px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.75}.empty{padding:15px 8px;text-align:center;color:#c9c1ce;font-size:12px}.radio-heading{display:flex;align-items:center;gap:7px;color:#ff5b84;font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.radio-dot{width:7px;height:7px;border-radius:50%;background:#746b78}.radio-dot.playing{background:#ff3869;box-shadow:0 0 9px rgba(255,56,105,.8)}.radio-content{display:block}.radio-copy{min-width:0}.radio-station{margin-top:5px;font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.radio-description{margin-top:2px;color:#c9c1ce;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.radio-controls{display:flex;justify-content:center;gap:9px;margin-top:10px}.radio-control{width:32px;height:32px;border:1px solid #514654;border-radius:50%;background:rgba(42,38,47,.96);color:#ff4773;display:grid;place-items:center;padding:0}.radio-control:hover{background:#382e39;border-color:#785164;color:#ff5b84}.radio-control:disabled{opacity:1;color:#ff4773;cursor:default}.radio-control svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}.radio-control .fill{fill:currentColor;stroke:none}[data-theme="white-titanium"] .widget,[data-theme="white-titanium"] .radio-widget{color:#26212a;background:rgba(252,248,252,.82);border-color:rgba(57,46,67,.16)}[data-theme="white-titanium"] .handle{border-color:rgba(57,46,67,.12)}[data-theme="white-titanium"] .handle span,[data-theme="white-titanium"] .empty,[data-theme="white-titanium"] .radio-description{color:#746b78}[data-theme="white-titanium"] .radio-control{background:rgba(255,255,255,.78);border-color:#d8d2df}
[data-theme="rose-gold-glass"] .widget,[data-theme="rose-gold-glass"] .radio-widget{color:#33272b;background:rgba(255,248,245,.88);border-color:rgba(151,90,74,.32)}[data-theme="miami-vice"] .widget,[data-theme="miami-vice"] .radio-widget{background:linear-gradient(145deg,rgba(34,14,72,.92),rgba(32,34,103,.9));border-color:rgba(255,117,200,.48)}[data-theme="chill-serwis"] .widget,[data-theme="chill-serwis"] .radio-widget{background:linear-gradient(145deg,rgba(4,19,38,.94),rgba(11,61,115,.9));border-color:rgba(149,214,255,.4)}[data-theme="lazarskie-rejony"] .widget,[data-theme="lazarskie-rejony"] .radio-widget{background:linear-gradient(145deg,rgba(24,31,43,.94),rgba(10,15,23,.92));border-color:rgba(108,132,178,.34)}
:root{--widget-panel:rgba(16,21,31,.9);--widget-panel2:rgba(23,29,41,.94);--widget-text:#f6f7fb;--widget-muted:#8992a3;--widget-line:#242c3b;--widget-accent:#24d9d5;--widget-pink:#ff3e77;--widget-shadow:0 18px 46px rgba(0,0,0,.32)}
:root[data-theme="white-titanium"],:root[data-theme="light"]{--widget-panel:rgba(235,234,228,.94);--widget-panel2:rgba(251,250,246,.96);--widget-text:#25272c;--widget-muted:#6b717d;--widget-line:#c9c7bf;--widget-accent:#66717f;--widget-pink:#a86672;--widget-shadow:0 18px 36px rgba(62,58,50,.2)}
:root[data-theme="chill-serwis"]{--widget-panel:rgba(7,29,58,.94);--widget-panel2:rgba(8,36,73,.96);--widget-text:#f4fbff;--widget-muted:#a8d8ff;--widget-line:rgba(149,214,255,.34);--widget-accent:#28a8ff;--widget-pink:#60d4ff}
:root[data-theme="rose-gold-glass"],:root[data-theme="rose-glass"]{--widget-panel:rgba(255,248,245,.9);--widget-panel2:rgba(255,248,245,.96);--widget-text:#33272b;--widget-muted:#80656a;--widget-line:rgba(151,90,74,.3);--widget-accent:#b45f72;--widget-pink:#d7788f;--widget-shadow:0 18px 36px rgba(105,64,55,.2)}
:root[data-theme="lazarskie-rejony"],:root[data-theme="enigma-z"]{--widget-panel:rgba(13,18,27,.92);--widget-panel2:rgba(24,32,46,.95);--widget-text:#eef4ff;--widget-muted:#98a6bb;--widget-line:rgba(108,132,178,.3);--widget-accent:#6de7ff;--widget-pink:#84a9ff}
:root[data-theme="miami-vice"]{--widget-panel:rgba(33,24,79,.94);--widget-panel2:rgba(37,30,76,.96);--widget-text:#fff7ff;--widget-muted:#ffd2f0;--widget-line:rgba(255,139,211,.42);--widget-accent:#6de7ff;--widget-pink:#ff75c8;--widget-shadow:0 20px 46px rgba(53,16,82,.42)}
.widget,.radio-widget{color:var(--widget-text)!important;background:var(--widget-panel)!important;border-color:var(--widget-line)!important;box-shadow:var(--widget-shadow)}.handle{border-color:var(--widget-line)}.handle span,.empty,.radio-description{color:var(--widget-muted)!important}.radio-heading,.radio-control{color:var(--widget-accent)}.radio-dot.playing{background:var(--widget-pink);box-shadow:0 0 9px color-mix(in srgb,var(--widget-pink) 75%,transparent)}.radio-control{border-color:var(--widget-line);background:var(--widget-panel2)}.radio-control:hover{border-color:var(--widget-accent);background:color-mix(in srgb,var(--widget-accent) 10%,var(--widget-panel2));color:var(--widget-accent)}.radio-control:disabled{opacity:.45;color:var(--widget-muted);border-color:var(--widget-line);background:var(--widget-panel2)}.stack{gap:10px}.widget:not(.notes-widget){flex:0 0 126px}.radio-widget{flex:0 0 120px}.notes-widget{min-height:0;flex:1 1 auto}.events,.widget-notes{scrollbar-width:none}.events::-webkit-scrollbar,.widget-notes::-webkit-scrollbar{width:0;height:0}.widget-notes{display:grid;align-content:start;gap:7px;padding:10px;overflow:auto}.widget-note{width:100%;min-height:30px;border:1px solid var(--widget-line);border-radius:10px;background:var(--widget-panel2);color:var(--widget-text);text-align:left;padding:7px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 12px/1.2 system-ui,sans-serif;cursor:pointer}.widget-note:hover{border-color:var(--widget-accent);color:var(--widget-accent)}
</style></head><body>
<div class="stack">
<section class="widget"><header class="handle"><strong id="todayTitle">Dzisiejsze wydarzenia</strong><span id="todayDate"></span></header><main id="todayEvents" class="events"></main></section>
<section class="widget"><header class="handle"><strong id="tomorrowTitle">Jutrzejsze wydarzenia</strong><span id="tomorrowDate"></span></header><main id="tomorrowEvents" class="events"></main></section>
<section class="radio-widget"><div class="radio-heading"><i id="radioDot" class="radio-dot"></i><span id="radioHeading">Odtwarzane radio</span></div><div class="radio-content"><div class="radio-copy"><div id="radioStation" class="radio-station">Radio wyłączone</div><div id="radioDescription" class="radio-description">Włącz stację w aplikacji Czatbox TT</div></div><div class="radio-controls"><button id="playPauseButton" class="radio-control" onclick="controlRadio('toggle-play')" aria-label="Odtwórz"><span id="playPauseIcon"></span></button><button id="muteButton" class="radio-control" onclick="controlRadio('toggle-mute')" aria-label="Wycisz"><span id="muteIcon"></span></button></div></div></section>
<section class="widget notes-widget"><header class="handle"><strong>Ostatnie notatki</strong><span>5 ostatnio edytowanych</span></header><main id="widgetNotes" class="widget-notes"></main></section>
</div>
<script>
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function dateKey(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
function controlRadio(action){window.czatboxDesktop.controlRadio(action)}
function openNote(id){window.czatboxDesktop.openNote(id)}
function playPauseSvg(playing){return playing?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7v10M15 7v10"></path></svg>`:`<svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M9 6.8v10.4l8-5.2z"></path></svg>`}
function muteSvg(muted){return muted?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7L8 10H5zM16 9l4 6M20 9l-4 6"></path></svg>`:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7L8 10H5zM16 9.5c1.5 1.4 1.5 3.6 0 5M18.5 7c3 2.8 3 7.2 0 10"></path></svg>`}
function eventsHtml(events,language){if(!events.length)return`<div class="empty">${language==="pl"?"Brak wydarzeń":"Keine Einträge"}</div>`;return events.map(event=>{const palette=event.palette||{bg:"rgba(255,56,105,.13)",text:"#ff7799",border:"rgba(255,91,132,.35)"},automaticTitle=!event.title||event.title===event.category,eventTitle=automaticTitle?(event.category||event.code):event.title,categoryLabel=automaticTitle?(event.code||event.category):[event.code,event.category].filter((value,index,array)=>value&&array.indexOf(value)===index).join(" · "),time=event.allDay?(language==="pl"?"cały dzień":"ganztägig"):`${event.start||""}–${event.end||""}`;return`<article class="event" style="background:${esc(palette.bg)};color:${esc(palette.text)};border-color:${esc(palette.border)}"><div class="event-name">${esc(eventTitle)}</div><div class="event-top"><span class="event-code">${esc(categoryLabel)}</span><span class="event-time">${esc(time)}</span></div></article>`}).join("")}
let currentData={events:[],notes:[],language:"pl",theme:"dark",radio:{active:false,playing:false,muted:false,station:"",description:""}};
function renderNotes(notes){const root=document.querySelector('#widgetNotes');root.replaceChildren();if(!Array.isArray(notes)||!notes.length){root.innerHTML='<div class="empty">Brak zapisanych notatek</div>';return}notes.slice(0,5).forEach(note=>{const button=document.createElement('button');button.type='button';button.className='widget-note';button.textContent=note.title||'Notatka';button.title='Otwórz notatkę';button.onclick=()=>openNote(note.id);root.append(button)})}
function render(data){currentData=data;const language=data.language==="de"?"de":"pl",radio=data.radio||{},today=new Date(),tomorrow=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1),sortEvents=list=>list.sort((a,b)=>(a.allDay?"":a.start||"").localeCompare(b.allDay?"":b.start||"")),todayEvents=sortEvents(data.events.filter(event=>event.date===dateKey(today))),tomorrowEvents=sortEvents(data.events.filter(event=>event.date===dateKey(tomorrow))),dateFormat=new Intl.DateTimeFormat(language==="pl"?"pl-PL":"de-DE",{weekday:"long",day:"numeric",month:"long"});document.documentElement.dataset.theme=data.theme||"dark-titanium";document.documentElement.lang=language;document.querySelector("#todayTitle").textContent=language==="pl"?"Dzisiejsze wydarzenia":"Heutige Ereignisse";document.querySelector("#tomorrowTitle").textContent=language==="pl"?"Jutrzejsze wydarzenia":"Morgige Ereignisse";document.querySelector("#todayDate").textContent=dateFormat.format(today);document.querySelector("#tomorrowDate").textContent=dateFormat.format(tomorrow);document.querySelector("#todayEvents").innerHTML=eventsHtml(todayEvents,language);document.querySelector("#tomorrowEvents").innerHTML=eventsHtml(tomorrowEvents,language);document.querySelector("#radioHeading").textContent=language==="pl"?"Odtwarzane radio":"Radiowiedergabe";document.querySelector("#radioDot").classList.toggle("playing",!!radio.playing);document.querySelector("#radioStation").textContent=radio.active?radio.station:(language==="pl"?"Radio wyłączone":"Radio ausgeschaltet");document.querySelector("#radioDescription").textContent=radio.active?(radio.playing?(language==="pl"?"Odtwarzanie":"Wiedergabe"):(language==="pl"?"Wstrzymano":"Pausiert"))+(radio.description?` · ${radio.description}`:""):(language==="pl"?"Włącz stację w aplikacji Czatbox TT":"Sender in Czatbox TT einschalten");const playButton=document.querySelector("#playPauseButton"),muteButton=document.querySelector("#muteButton");playButton.disabled=!radio.active;muteButton.disabled=!radio.active;document.querySelector("#playPauseIcon").innerHTML=playPauseSvg(!!radio.playing);document.querySelector("#muteIcon").innerHTML=muteSvg(!!radio.muted);playButton.setAttribute("aria-label",radio.playing?(language==="pl"?"Pauza":"Pause"):(language==="pl"?"Odtwórz":"Wiedergeben"));muteButton.setAttribute("aria-label",radio.muted?(language==="pl"?"Włącz dźwięk":"Ton einschalten"):(language==="pl"?"Wycisz":"Stummschalten"));renderNotes(data.notes||[])}
window.czatboxDesktop.onWidgetData(render);setInterval(()=>render(currentData),60000);
</script></body></html>
