<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Czatbox TT — pasek pulpitu</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#f4f7fb;background:transparent}body{padding:0}.sidebar{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 8px;border:1px solid color-mix(in srgb,var(--accent) 48%,#26354a);border-right:0;border-radius:0;background:linear-gradient(180deg,rgba(15,22,33,.96),rgba(10,15,23,.94));box-shadow:0 16px 38px rgba(0,0,0,.36);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:8px;padding:1px 3px 9px;border-bottom:1px solid rgba(255,255,255,.11);color:var(--accent)}.brand svg{width:18px;height:18px}.brand span{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.quick-actions{display:grid;grid-template-columns:1fr;gap:7px}.quick-action{width:100%;min-height:50px;display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--accent) 30%,#344157);border-radius:11px;background:rgba(255,255,255,.035);color:#edf5ff;font:700 11px/1.1 system-ui,sans-serif;cursor:pointer;text-align:left}.quick-action:hover,.quick-action:focus-visible,.drive:hover,.drive:focus-visible{outline:none;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,rgba(255,255,255,.04));color:var(--accent)}.quick-action svg,.drive-icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}.drive-section{min-height:0;display:flex;flex:0 1 auto;flex-direction:column;gap:7px;padding-top:3px}.section-title{padding:0 3px;color:#aeb9c9;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.drives{max-height:calc(100vh - 330px);min-height:0;overflow:auto;display:grid;align-content:start;gap:6px;padding-right:1px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 55%,transparent) transparent}.drive{width:100%;padding:8px;border:1px solid rgba(175,194,221,.19);border-radius:11px;background:rgba(255,255,255,.035);color:#edf5ff;text-align:left;cursor:pointer}.drive-head{display:flex;align-items:center;gap:7px}.drive-icon{flex:0 0 auto;color:var(--accent)}.drive-copy{min-width:0;flex:1}.drive-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:750}.drive-meta{margin-top:2px;color:#aeb9c9;font-size:9px}.meter{height:5px;margin-top:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}.meter b{display:block;height:100%;border-radius:inherit;background:var(--accent);box-shadow:0 0 9px color-mix(in srgb,var(--accent) 68%,transparent)}.empty{padding:14px 6px;text-align:center;color:#aeb9c9;font-size:10px;line-height:1.45}.footer{margin-top:auto;padding:8px 3px 0;border-top:1px solid rgba(255,255,255,.1);color:#91a0b3;font-size:9px;text-align:center}.icon-template{display:none}
.sidebar{border:0;border-left:1px solid color-mix(in srgb,var(--accent) 48%,#26354a)}.drive-name,.drive-meta{display:block}.drive-section,.tool-section{flex:none}.tool-section{display:grid;gap:7px}.drives{max-height:none;overflow:visible}.drive,.quick-action{height:54px;min-height:54px}.drive{padding:6px 8px}.drive-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{display:block;height:5px;line-height:0}.footer{display:none}</style></head><body>
<main class="sidebar">
  <section class="drive-section"><div class="section-title">Dyski lokalne</div><div id="drives" class="drives"></div></section>
  <section class="tool-section"><div class="section-title">Przybornik</div><nav class="quick-actions" aria-label="Przybornik">
    <button class="quick-action" data-workspace="calendar" title="Kalendarz"><svg viewBox="0 0 24 24"><path d="M5 6h14v13H5zM8 3v5M16 3v5M5 10h14M9 14h2M13 14h2M9 17h2"></path></svg><span>Kalendarz</span></button>
    <button class="quick-action" data-workspace="notes" title="Notatnik"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"></path></svg><span>Notatnik</span></button>
    <button class="quick-action" data-workspace="radio" title="Radio"><svg viewBox="0 0 24 24"><path d="M5 8h14v11H5zM8 5h8M9 13a2.5 2.5 0 1 0 0 .01M14 12h3M14 15h3"></path></svg><span>Radio</span></button>
    <button class="quick-action" data-control-panel title="Panel sterowania Windows"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14M9 5v4M15 10v4M11 15v4"></path></svg><span>Panel Windows</span></button>
  </nav></section>
  <footer class="footer">Użycie przestrzeni dyskowej</footer>
</main>
<template id="diskIcon"><svg class="drive-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v10H4zM7 11h.01M10 11h.01M7 15h10"></path></svg></template>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function displaySize(value){const units=['B','KB','MB','GB','TB'];let size=Math.max(0,Number(value)||0),index=0;while(size>=1024&&index<units.length-1){size/=1024;index++}return `${size.toFixed(index<3?0:1)} ${units[index]}`}
function render(data){const accent=/^#[a-f0-9]{6}$/i.test(data?.accent||'')?data.accent:'#4fdde5';document.documentElement.style.setProperty('--accent',accent);const root=document.querySelector('#drives'),drives=Array.isArray(data?.drives)?data.drives:[];if(!drives.length){root.innerHTML='<p class="empty">Nie udało się odczytać partycji.</p>';return}root.innerHTML=drives.map(drive=>{const used=Math.max(0,Math.min(100,Math.round((1-(Number(drive.free)||0)/(Number(drive.size)||1))*100)));const name=drive.name?`${drive.id} · ${drive.name}`:drive.id;return `<button type="button" class="drive" data-drive="${esc(drive.id)}" title="Otwórz ${esc(name)}"><span class="drive-head">${document.querySelector('#diskIcon').innerHTML}<span class="drive-copy"><span class="drive-name">${esc(name)}</span><span class="drive-meta">${used}% zajęte · ${displaySize(drive.free)} wolne</span></span></span><span class="meter"><b style="width:${used}%"></b></span></button>`}).join('');root.querySelectorAll('[data-drive]').forEach(button=>button.addEventListener('click',()=>window.czatboxDesktop.openDrive(button.dataset.drive)))}
document.querySelectorAll('[data-workspace]').forEach(button=>button.addEventListener('click',()=>window.czatboxDesktop.openWorkspace(button.dataset.workspace)));
document.querySelector('[data-control-panel]').addEventListener('click',()=>window.czatboxDesktop.openControlPanel());
window.czatboxDesktop.onWidgetData(render);
</script></body></html>
